<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rentora - View Property</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; 
           padding: 40px 20px; background: #f5f5f5; }
    .card { background: white; border-radius: 16px; 
            padding: 40px; max-width: 400px; margin: 0 auto; }
    .icon { font-size: 60px; margin-bottom: 20px; }
    h1 { color: #6C63FF; font-size: 24px; }
    p { color: #666; line-height: 1.6; }
    .btn { background: #6C63FF; color: white; padding: 14px 32px;
           border-radius: 12px; text-decoration: none; 
           display: inline-block; margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🏠</div>
    <h1>Rentora</h1>
    <p>Someone shared a property with you!</p>
    <p>Download the Rentora app to view this property and find your perfect home.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.pkryon.rentora">
      Download App
    </a>
    <br><br>
    <p style="font-size: 12px; color: #999;">Find rental rooms, flats & PGs — No broker fees!</p>
  </div>
</body>
</html>
